<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Baiamonte eufy Bridge</title>
  <style>
    :root{color-scheme:dark;--bg:#0c1118;--panel:#151d27;--line:#263445;--text:#edf4fb;--muted:#91a2b5;--blue:#2f9cf4;--cyan:#49d5ca;--green:#54d38a;--amber:#ffbf5b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#16385a 0,transparent 28rem),var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 18px 48px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:14px}.mark{width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,var(--blue),var(--cyan));display:grid;place-items:center;font-weight:850;font-size:21px;box-shadow:0 10px 35px #2f9cf444}.eyebrow{color:var(--cyan);font-size:12px;font-weight:750;letter-spacing:.12em;text-transform:uppercase}h1{margin:2px 0 0;font-size:clamp(22px,4vw,34px);letter-spacing:-.03em}.status{padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}.status.ok{color:var(--green);border-color:#2d6849}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{grid-column:span 3;background:linear-gradient(145deg,#17212d,#111923);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}.wide{grid-column:span 8}.side{grid-column:span 4}.full{grid-column:1/-1}.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.value{font-size:32px;font-weight:780;margin-top:5px;letter-spacing:-.04em}.sub{color:var(--muted);margin-top:3px}.bar{height:7px;border-radius:10px;background:#263342;overflow:hidden;margin-top:12px}.bar i{height:100%;display:block;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:inherit}h2{font-size:18px;margin:0 0 14px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-size:12px;font-weight:650}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#213043;color:#c8dbed;font-size:12px}.policy{display:grid;grid-template-columns:auto 1fr;gap:9px 14px}.policy dt{color:var(--muted)}.policy dd{margin:0}.warn{color:var(--amber)}.muted{color:var(--muted)}footer{margin-top:18px;color:var(--muted);font-size:12px}@media(max-width:850px){.card{grid-column:span 6}.wide,.side{grid-column:1/-1}}@media(max-width:520px){header{align-items:flex-start;flex-direction:column}.card{grid-column:1/-1}.tablewrap{overflow:auto}}
  </style>
</head>
<body><main class="wrap"><header><div class="brand"><div class="mark">Be</div><div><div class="eyebrow">Home Assistant integration</div><h1>Baiamonte eufy Bridge</h1></div></div><div id="health" class="status">Loading…</div></header><section id="content" class="grid"></section><footer id="updated"></footer></main>
<script>
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(a,b)=>b?Math.round(a/b*100):0;const size=n=>n?`${(n/1048576).toFixed(1)} MB`:'0 MB';
async function load(){const health=document.querySelector('#health'),content=document.querySelector('#content');try{const data=await fetch('api/status',{cache:'no-store'}).then(r=>r.json());health.textContent=data.bridge?.available?'Bridge online':'Bridge unavailable';health.className='status '+(data.bridge?.available?'ok':'');if(!data.totals){content.innerHTML=`<article class="card full"><h2>Starting</h2><div class="warn">${esc(data.error||'Waiting for inventory')}</div></article>`;return}const t=data.totals,s=data.snapshotCache||{},m=data.mega||{},snap=pct(t.camerasWithSnapshots,t.cameras);content.innerHTML=`
<article class="card"><div class="label">Connected devices</div><div class="value">${t.devices}</div><div class="sub">${t.stations} station endpoints</div></article>
<article class="card"><div class="label">Camera endpoints</div><div class="value">${t.cameras}</div><div class="sub">${t.streamCapableCameras} support livestream</div></article>
<article class="card"><div class="label">Cached snapshots</div><div class="value">${t.camerasWithSnapshots}/${t.cameras}</div><div class="sub">${snap}% currently populated</div><div class="bar"><i style="width:${snap}%"></i></div></article>
<article class="card"><div class="label">AI-capable cameras</div><div class="value">${t.camerasWithAi}</div><div class="sub">Detection metadata exposed</div></article>
<article class="card wide"><h2>Product coverage</h2><div class="tablewrap"><table><thead><tr><th>Model</th><th>Count</th><th>Snapshots</th><th>Streams</th><th>AI fields</th><th>Writable</th></tr></thead><tbody>${data.models.map(r=>`<tr><td><span class="pill">${esc(r.model)}</span></td><td>${r.count}</td><td>${r.snapshots}/${r.count}</td><td>${r.streaming}/${r.count}</td><td>${r.aiProperties}</td><td>${r.writable}</td></tr>`).join('')}</tbody></table></div></article>
<article class="card side"><h2>Cloud migration</h2><dl class="policy"><dt>Mega login</dt><dd>${m.megaAuthenticated?'Active':'Pending'}</dd><dt>Mega catalogs</dt><dd>${m.catalogs?.available||0} available / ${m.catalogs?.attempted||0} queried</dd><dt>Native parameter IDs</dt><dd>${m.inventory?.parameters?.knownTypes?.length||0} mapped / ${m.inventory?.parameters?.types?.length||0} seen</dd><dt>Unmapped IDs</dt><dd class="${m.inventory?.parameters?.unknownTypes?.length?'warn':''}">${m.inventory?.parameters?.unknownTypes?.length||0}</dd><dt>OTA records</dt><dd>${m.ota?.records||0}</dd><dt>E10 firmware</dt><dd>${m.firmware?.downloaded?'Downloaded':m.firmware?.packageAvailable?'Available':'Not offered'}</dd><dt>Legacy fallback</dt><dd class="${m.legacyFallbackRequired?'warn':''}">${m.legacyFallbackRequired?'Still required':'Retired'}</dd></dl></article>
<article class="card side"><h2>Snapshot cache</h2><div class="value">${s.files||0}</div><div class="sub">files · ${size(s.bytes)}</div><p class="muted">Snapshots are the newest push-event images, persisted across restarts. Empty cameras populate after their next supported event.</p></article>
<article class="card wide"><h2>Transport policy</h2><dl class="policy">${Object.entries(data.policy||{}).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></article>`;document.querySelector('#updated').textContent=`Updated ${new Date(data.generatedAt).toLocaleString()} · Schema ${data.bridge.schema} · Refreshes every 30 seconds`;}catch(e){health.textContent='Dashboard error';content.innerHTML=`<article class="card full"><div class="warn">${esc(e.message)}</div></article>`}}load();setInterval(load,30000);
</script></body></html>
