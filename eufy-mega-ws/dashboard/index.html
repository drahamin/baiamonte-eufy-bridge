<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Baiamonte eufy Bridge</title>
  <style>
    :root{color-scheme:dark;--bg:#0c1118;--panel:#151d27;--line:#263445;--text:#edf4fb;--muted:#91a2b5;--blue:#2f9cf4;--cyan:#49d5ca;--green:#54d38a;--amber:#ffbf5b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#16385a 0,transparent 28rem),var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 18px 48px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:14px}.mark{width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,var(--blue),var(--cyan));display:grid;place-items:center;font-weight:850;font-size:21px;box-shadow:0 10px 35px #2f9cf444}.eyebrow{color:var(--cyan);font-size:12px;font-weight:750;letter-spacing:.12em;text-transform:uppercase}h1{margin:2px 0 0;font-size:clamp(22px,4vw,34px);letter-spacing:-.03em}.status{padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}.status.ok{color:var(--green);border-color:#2d6849}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{grid-column:span 3;background:linear-gradient(145deg,#17212d,#111923);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}.wide{grid-column:span 8}.side{grid-column:span 4}.full{grid-column:1/-1}.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.value{font-size:32px;font-weight:780;margin-top:5px;letter-spacing:-.04em}.sub{color:var(--muted);margin-top:3px}.bar{height:7px;border-radius:10px;background:#263342;overflow:hidden;margin-top:12px}.bar i{height:100%;display:block;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:inherit}h2{font-size:18px;margin:0 0 14px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-size:12px;font-weight:650}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#213043;color:#c8dbed;font-size:12px}.policy{display:grid;grid-template-columns:auto 1fr;gap:9px 14px}.policy dt{color:var(--muted)}.policy dd{margin:0}.notice{border-color:#795f2e;background:linear-gradient(145deg,#2b261b,#171a20);display:flex;gap:12px;align-items:flex-start}.notice strong{color:var(--amber)}.notice p{margin:2px 0 0;color:var(--muted)}.coverage{min-width:90px}.coverage .bar{margin-top:4px}details summary{cursor:pointer;color:var(--amber)}details code{display:block;max-width:420px;margin-top:7px;white-space:normal;overflow-wrap:anywhere;color:#c8dbed}.warn{color:var(--amber)}.muted{color:var(--muted)}.migration-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.migration-head h2{margin:2px 0 0}.statebadge{border:1px solid #2d6849;border-radius:999px;color:var(--green);font-size:12px;font-weight:700;padding:5px 9px;white-space:nowrap}.statebadge.pending{border-color:#795f2e;color:var(--amber)}.migration-score{display:flex;align-items:baseline;gap:9px;margin-top:18px}.migration-score strong{font-size:36px;letter-spacing:-.05em}.migration-score span{color:var(--muted)}.stackbar{display:flex;height:9px;margin:8px 0 10px;overflow:hidden;border-radius:999px;background:#263342}.stackbar i{background:linear-gradient(90deg,var(--blue),var(--cyan))}.stackbar b{background:#516b87}.migration-legend{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--muted);font-size:11px}.migration-legend span:before{content:'';display:inline-block;width:7px;height:7px;margin-right:5px;border-radius:50%;background:var(--blue)}.migration-legend .classified:before{background:#516b87}.migration-legend .unresolved:before{background:var(--amber)}.migration-rows{margin-top:17px;border-top:1px solid var(--line)}.migration-row{display:grid;grid-template-columns:minmax(108px,.8fr) minmax(0,1.2fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.migration-row .k{color:var(--muted)}.migration-row .v{min-width:0}.migration-row small{display:block;color:var(--muted);margin-top:2px}.migration-note{margin:14px 0 0;color:var(--muted);font-size:12px}.migration-note strong{color:var(--amber)}footer{margin-top:18px;color:var(--muted);font-size:12px}@media(max-width:850px){.card{grid-column:span 6}.wide,.side{grid-column:1/-1}}@media(max-width:520px){header{align-items:flex-start;flex-direction:column}.card{grid-column:1/-1}.tablewrap{overflow:auto}.notice{display:block}.migration-row{grid-template-columns:1fr}.migration-row .v{font-size:16px}}
  </style>
</head>
<body><main class="wrap"><header><div class="brand"><div class="mark">Be</div><div><div class="eyebrow">Home Assistant integration</div><h1>Baiamonte eufy Bridge</h1></div></div><div id="health" class="status">Loading…</div></header><section id="content" class="grid"></section><footer id="updated"></footer></main>
<script>
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(a,b)=>b?Math.round(a/b*100):0;const size=n=>n?`${(n/1048576).toFixed(1)} MB`:'0 MB';
async function load(){const health=document.querySelector('#health'),content=document.querySelector('#content');try{const data=await fetch('api/status',{cache:'no-store'}).then(r=>r.json());health.textContent=data.bridge?.available?'Bridge online':'Bridge unavailable';health.className='status '+(data.bridge?.available?'ok':'');if(!data.totals){content.innerHTML=`<article class="card full"><h2>Starting</h2><div class="warn">${esc(data.error||'Waiting for inventory')}</div></article>`;return}const t=data.totals,s=data.snapshotCache||{},m=data.mega||{},os=m.observedSchemas||{},ip=m.inventory?.parameters||{},snap=pct(t.camerasWithSnapshots,t.cameras),semantic=pct(os.known,os.dataPoints),classifiedPct=pct(os.classified,os.dataPoints),research=pct((os.known||0)+(os.classified||0),os.dataPoints),schemas=Object.entries(os.models||{}).sort(([a,x],[b,y])=>(y.unknown-x.unknown)||a.localeCompare(b)),serverCatalogs=m.catalogs?.available||0,effectiveCatalogs=m.catalogs?.effectiveAvailable??((m.catalogs?.available||0)+(m.catalogs?.synthesized||0)),observedActive=(m.catalogs?.synthesized||0)>0,complexModels=(data.models||[]).filter(r=>r.complexAiProperties?.length),stationModels=new Set((data.stationModels||[]).map(r=>r.model)),deviceModels=new Set((data.models||[]).map(r=>r.model)),yes=v=>v?'<span class="pill">Yes</span>':'—',role=model=>stationModels.has(model)&&deviceModels.has(model)?'Camera + station endpoint':stationModels.has(model)?'HomeBase / station':model==='T87A0'?'Smart display':deviceModels.has(model)?'Camera':'Other';content.innerHTML=`
<article class="card"><div class="label">Connected devices</div><div class="value">${t.devices}</div><div class="sub">${t.stations} station endpoints</div></article>
<article class="card"><div class="label">Camera endpoints</div><div class="value">${t.cameras}</div><div class="sub">${t.streamCapableCameras} support livestream</div></article>
<article class="card"><div class="label">Cached snapshots</div><div class="value">${t.camerasWithSnapshots}/${t.cameras}</div><div class="sub">${snap}% currently populated</div><div class="bar"><i style="width:${snap}%"></i></div></article>
<article class="card"><div class="label">AI controls</div><div class="value">${t.camerasWithWritableAi}/${t.cameras}</div><div class="sub">${t.camerasWithAi} expose detection metadata</div></article>
<article class="card full"><h2>HomeBase evidence and video</h2><div class="policy"><dt>Account recording index</dt><dd>${m.megaAuthenticated?'<span class="pill">Authenticated</span>':'Waiting for Mega authentication'}</dd><dt>Local HomeBase indexes</dt><dd>${t.localRecordIndexStations||0} detailed · ${t.dateRecordIndexStations||0} date indexed</dd><dt>Encrypted saved-video transport</dt><dd>${t.recordingDownloadCameras||0} of ${t.cameras} camera endpoints advertise clip download</dd><dt>Event thumbnails</dt><dd>${t.thumbnailDownloadStations||0} HomeBase endpoints advertise direct thumbnail retrieval · ${s.files||0} latest event images cached</dd><dt>Live video wall</dt><dd>${t.streamCapableCameras} cameras available to the Baiamonte Eufy Security companion for authenticated Home Assistant views</dd></div><p class="muted">The evidence browser uses HomeBase/account indexes to locate recordings, then requests the encrypted clip or thumbnail through the bridge. Storage paths, cipher material, face IDs and source URLs are never exposed in dashboard data.</p></article>
${observedActive?`<article class="card full notice"><strong>Native read catalogs active</strong><p>${effectiveCatalogs} of ${m.catalogs?.attempted||0} connected product catalogs are populated. ${m.catalogs.synthesized} are derived from signed Mega inventory because Eufy's descriptor endpoint returned ${serverCatalogs}; derived points remain read-only and never authorize commands.</p></article>`:''}
<article class="card wide"><h2>Product coverage</h2><div class="tablewrap"><table><thead><tr><th>Model</th><th>Count</th><th>Snapshots</th><th>Streams</th><th>PTZ</th><th>Presets</th><th>Calibration</th><th>Tracking</th><th>Privacy</th><th>Zoom</th><th>AI controls</th><th>AI fields</th><th>Writable</th></tr></thead><tbody>${data.models.map(r=>`<tr><td><span class="pill">${esc(r.model)}</span></td><td>${r.count}</td><td>${r.snapshots}/${r.count}</td><td>${r.streaming}/${r.count}</td><td>${yes(r.panTilt)}</td><td>${yes(r.presets)}</td><td>${yes(r.calibration)}</td><td>${yes(r.tracking)}</td><td>${yes(r.privacyPosition)}</td><td>${yes(r.zoom)}</td><td>${r.writableAiProperties?.length?`<details><summary>${r.writableAiProperties.length}</summary><code>${r.writableAiProperties.map(esc).join(', ')}</code></details>`:0}</td><td>${r.aiProperties}</td><td>${r.writable}</td></tr>`).join('')}</tbody></table></div><p class="muted">Capabilities are queried from each connected device. PTZ and preset controls are reported only when the bridge advertises their commands; AI controls list writable properties, while AI fields also include read-only event results.</p></article>
${complexModels.length?`<article class="card full"><h2>Structured AI fields</h2><div class="tablewrap"><table><thead><tr><th>Model</th><th>Field</th><th>Available</th><th>Shape</th><th>Keys / field types</th><th>Home Assistant</th></tr></thead><tbody>${complexModels.flatMap(r=>r.complexAiProperties.map(p=>`<tr><td><span class="pill">${esc(r.model)}</span></td><td>${esc(p.name)}</td><td>${yes(p.present)}</td><td>${esc(p.shape?.kind)} · ${p.shape?.count||0}</td><td><code>${Object.entries(p.shape?.fieldTypes||{}).map(([k,v])=>`${esc(k)}: ${esc(Array.isArray(v)?v.join('/'):v)}`).join(', ')||'No structured keys observed'}</code></td><td>Diagnostic structure sensor; values are not flattened or made writable</td></tr>`)).join('')}</tbody></table></div><p class="muted">This reports bounded names and types only. Recognition results, face/person identifiers, coordinates, URLs, and other raw AI values are never copied into diagnostics.</p></article>`:''}
<article class="card side migration"><div class="migration-head"><div><div class="eyebrow">Mega cloud</div><h2>Catalog coverage</h2></div><span class="statebadge ${m.megaAuthenticated?'':'pending'}">${m.megaAuthenticated?'Authenticated':'Pending'}</span></div><div class="migration-score"><strong>${semantic}%</strong><span>semantically named</span></div><div class="stackbar" aria-label="${semantic}% verified, ${classifiedPct}% classified"><i style="width:${semantic}%"></i><b style="width:${classifiedPct}%"></b></div><div class="migration-legend"><span>${os.known||0} verified</span><span class="classified">${os.classified||0} family-classified</span><span class="unresolved">${os.unknown||0} unresolved</span></div><div class="migration-rows"><div class="migration-row"><div class="k">Effective native catalogs</div><div class="v">${effectiveCatalogs} of ${m.catalogs?.attempted||0} populated<small>Official descriptors plus signed observed Mega inventory</small></div></div><div class="migration-row"><div class="k">Official descriptors</div><div class="v">${m.catalogs?.available||0} populated · ${m.catalogs?.requests??(m.catalogs?.attempted||0)} requests<small>${serverCatalogs?'Using writable-mode evidence where offered':'No server write descriptors offered'}</small></div></div><div class="migration-row"><div class="k">Observed catalog</div><div class="v">${os.products||0} models · ${os.dataPoints||0} model data points</div></div><div class="migration-row"><div class="k">Unique IDs</div><div class="v">${ip.knownTypes?.length||0} verified · ${ip.classifiedTypes?.length||0} classified · <span class="${ip.unknownTypes?.length?'warn':''}">${ip.unknownTypes?.length||0} unresolved</span><small>${ip.types?.length||0} distinct IDs observed</small></div></div><div class="migration-row"><div class="k">OTA inventory</div><div class="v">${m.ota?.records||0} records<small>E10 package: ${m.firmware?.downloaded?'downloaded':m.firmware?.packageAvailable?'available':'not currently offered'}</small></div></div></div><p class="migration-note">Catalog read path: <strong>Mega native</strong>. Entity inventory/properties: <strong>${m.compatibility?.inventory?'compatibility retained':'Mega native'}</strong>. Controls: <strong>${m.legacyFallbackRequired?'P2P/compatibility retained':'Mega native'}</strong>. Compatibility remains gated to coverage without a proven Mega entity or writable schema.</p></article>
<article class="card full"><h2>Observed Mega schema coverage</h2><div class="tablewrap"><table><thead><tr><th>Model</th><th>Role</th><th>Data points</th><th>Verified</th><th>Classified</th><th>Unresolved IDs</th><th>Coverage</th><th>Access</th></tr></thead><tbody>${schemas.length?schemas.map(([model,r])=>{const coverage=pct((r.known||0)+(r.classified||0),r.dataPoints),ids=Array.isArray(r.unresolvedDetails)&&r.unresolvedDetails.length?r.unresolvedDetails:(r.unknownIds||[]).map(id=>({id,profiles:[]})),classified=Array.isArray(r.classifiedIds)?r.classifiedIds:[];return`<tr><td><span class="pill">${esc(model)}</span></td><td>${role(model)}</td><td>${r.dataPoints}</td><td>${r.known||0}</td><td>${classified.length?`<details><summary>${r.classified||classified.length}</summary><code>${classified.map(x=>`${esc(x.id)}: ${esc(x.name)} [${(x.profiles||[]).map(esc).join('/')||'untyped'}]`).join(', ')}</code></details>`:0}</td><td>${ids.length?`<details><summary>${r.unknown}</summary><code>${ids.map(x=>`${esc(x.id)} [${(x.profiles||[]).map(esc).join('/')||'untyped'}]`).join(', ')}</code></details>`:r.unknown}</td><td class="coverage">${coverage}%<div class="bar"><i style="width:${coverage}%"></i></div></td><td>Observed fields are read-only</td></tr>`}).join(''):'<tr><td colspan="8" class="muted">Waiting for native Mega inventory.</td></tr>'}</tbody></table></div><p class="muted">Verified means the field has direct parser or payload evidence. Classified means its feature family is known but its exact semantics are not; it remains non-writable. Unresolved IDs have neither. Bracketed value shapes contain no raw values.</p></article>
<article class="card side"><h2>Snapshot cache</h2><div class="value">${s.files||0}</div><div class="sub">files · ${size(s.bytes)}</div><p class="muted">Snapshots are the newest push-event images, persisted across restarts. Empty cameras populate after their next supported event.</p></article>
<article class="card wide"><h2>Transport policy</h2><dl class="policy">${Object.entries(data.policy||{}).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></article>`;document.querySelector('#updated').textContent=`Updated ${new Date(data.generatedAt).toLocaleString()} · Schema ${data.bridge.schema} · Refreshes every 30 seconds`;}catch(e){health.textContent='Dashboard error';content.innerHTML=`<article class="card full"><div class="warn">${esc(e.message)}</div></article>`}}load();setInterval(load,30000);
</script></body></html>
