configuration:
  username:
    name: Nome utente
    description: Nome utente dell'account cloud Eufy (e-mail)
  password:
    name: Password
    description: Password dell'account cloud Eufy
  country:
    name: Paese
    description: Paese dell'account cloud Eufy
  accept_invitations:
    name: Accettare inviti
    description: Accettare automaticamente un invito ricevuto
  polling_interval:
    name: Intervallo polling cloud
    description: Intervallo di polling del cloud in minuti
  event_duration:
    name: Durata dell'evento
    description: Durata dell'evento del dispositivo in secondi (tempo di reset dell'evento)
  snapshot_cache:
    name: Memorizza immagini evento
    description: Conserva l'ultima immagine valida di ogni telecamera dopo il riavvio del componente
  mega_inventory_diagnostics:
    name: Analizza i cataloghi eufy Mega
    description: Legge in background cataloghi nativi di dispositivi, funzioni, dati e OTA
  firmware_research:
    name: Scarica firmware E10 per ricerca
    description: Salva un pacchetto OTA E10 offerto dal server senza avviare un aggiornamento
  control_audit_target:
    name: Temporary local control audit target
    description: Optional exact device name for an explicit one-shot local control audit
  trusted_device_name:
    name: Nome dispositivo attendibile
    description: Nome facoltativo del servizio nell'elenco dei dispositivi attendibili Eufy
  debug:
    name: Debug
    description: Abilita la modalità di debug
  port:
    name: Porta
    description: Porta di ascolto (host)
  stations:
    name: Stazioni
    description: Indirizzi IP o indirizzi di broadcast suggeriti per le stazioni
  ipv4first:
    name: Forza prima indirizzi IPv4
    description: Forza l'ordine dei risultati dns su Node.js per restituire prima gli indirizzi IPv4
