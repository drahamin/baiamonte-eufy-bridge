configuration:
  username:
    name: Benutzername
    description: Eufy Cloud-Konto-Benutzername (E-Mail)
  password:
    name: Passwort
    description: Eufy Cloud-Konto-Passwort
  country:
    name: Land
    description: Eufy Cloud-Konto Land
  accept_invitations:
    name: Einladungen annehmen
    description: Erhaltene Einladung automatisch annehmen
  polling_interval:
    name: Cloud-Abfrageintervall
    description: Cloud-Abfrageintervall in Minuten
  event_duration:
    name: Dauer des Ereignisses
    description: Dauer des Geräteereignisses in Sekunden (Ereignisrücksetzzeit)
  snapshot_cache:
    name: Ereignisbilder speichern
    description: Letztes gültiges Push-Ereignisbild jeder Kamera über Neustarts hinweg speichern
  mega_inventory_diagnostics:
    name: eufy Mega-Kataloge scannen
    description: Native Geräte-, Funktions-, Datenpunkt- und OTA-Kataloge im Hintergrund lesen
  firmware_research:
    name: E10-Forschungsfirmware herunterladen
    description: Ein vom Server angebotenes E10-OTA-Paket speichern, ohne ein Upgrade zu starten
  control_audit_target:
    name: Temporary local control audit target
    description: Optional exact device name for an explicit one-shot local control audit
  trusted_device_name:
    name: Name des vertrauenswürdigen Geräts
    description: Optionaler Name dieses Dienstes in Eufys Liste vertrauenswürdiger Geräte
  debug:
    name: Debug
    description: Debug-Modus aktivieren
  port:
    name: Port
    description: Port (host)
  stations:
    name: Stationen
    description: Vorgeschlagene IP-Adressen oder Broadcast-Adressen für Stationen
  ipv4first:
    name: IPv4-Adressen zuerst erzwingen
    description: Erzwingt die DNS-Ergebnisreihenfolge auf Node.js, um IPv4-Adressen zuerst zurückzugeben
