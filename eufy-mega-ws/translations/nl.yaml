configuration:
  username:
    name: Gebruikersnaam
    description: Eufy cloud account gebruikersnaam (e-mail)
  password:
    name: Wachtwoord
    description: Eufy cloud account wachtwoord
  country:
    name: Land
    description: Eufy cloud account land
  accept_invitations:
    name: Uitnodigingen accepteren
    description: Automatisch een ontvangen uitnodiging accepteren
  polling_interval:
    name: Cloud polling interval
    description: Cloud polling interval in minuten
  event_duration:
    name: Duur van het evenement
    description: Duur van de gebeurtenis van het apparaat in seconden (reset-tijd van de gebeurtenis)
  snapshot_cache:
    name: Gebeurtenisbeelden bewaren
    description: Bewaar het laatste geldige pushbeeld van elke camera na een herstart van de add-on
  mega_inventory_diagnostics:
    name: eufy Mega-catalogi scannen
    description: Lees native apparaat-, functie-, datapunt- en OTA-catalogi op de achtergrond
  firmware_research:
    name: E10-onderzoeksfirmware downloaden
    description: Bewaar een door de server aangeboden E10 OTA-pakket zonder een upgrade te starten
  trusted_device_name:
    name: Naam vertrouwd apparaat
    description: Optionele naam van deze service in Eufy's lijst met vertrouwde apparaten
  debug:
    name: Debug
    description: Debug-modus inschakelen
  port:
    name: Poort
    description: Luisterpoort (host)
  stations:
    name: Stations
    description: Voorgestelde IP-adressen of broadcast-adressen voor stations
  ipv4first:
    name: Forceer eerst IPv4-adressen
    description: Forceert de DNS-resultaatvolgorde op Node.js om eerst IPv4-adressen te retourneren
