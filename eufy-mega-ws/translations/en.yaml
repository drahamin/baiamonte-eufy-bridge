configuration:
  username:
    name: Username
    description: Eufy cloud account username (e-mail)
  password:
    name: Password
    description: Eufy cloud account password
  country:
    name: Country
    description: Eufy cloud account country
  accept_invitations:
    name: Accept invitations
    description: Accept automatically a received invitation
  polling_interval:
    name: Cloud polling interval
    description: Cloud polling interval in minutes
  event_duration:
    name: Event duration
    description: Device event duration in seconds (event reset time)
  snapshot_cache:
    name: Cache event snapshots
    description: Persist the last valid push-event image for each camera across add-on restarts
  mega_inventory_diagnostics:
    name: Scan eufy Mega catalogs
    description: Read native device, capability, data-point, and OTA catalogs in the background
  firmware_research:
    name: Download E10 research firmware
    description: Save a server-offered Smart Display E10 OTA package to the Home Assistant share without starting an upgrade
  control_audit_target:
    name: Temporary local control audit target
    description: Optional exact device name for an explicit one-shot local control audit
  trusted_device_name:
    name: Trusted device name
    description: Optional name shown for this bridge in Eufy's trusted-device list
  debug:
    name: Debug
    description: Enable debug mode
  port:
    name: Port
    description: Listening port (host)
  stations:
    name: Stations
    description: Suggested IP addresses or broadcast addresses for stations
  ipv4first:
    name: Force IPv4 addresses first
    description: Forces the dns result order on Node.js to return IPv4 addresses first
