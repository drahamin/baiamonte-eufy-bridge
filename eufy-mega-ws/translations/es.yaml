configuration:
  username:
    name: Nombre de usuario
    description: Nombre de usuario de la cuenta en la nube de Eufy (correo electrónico)
  password:
    name: Contraseña
    description: Contraseña de la cuenta en la nube de Eufy
  country:
    name: País
    description: País de la cuenta en la nube de Eufy
  accept_invitations:
    name: Aceptar invitaciones
    description: Aceptar automáticamente una invitación recibida
  polling_interval:
    name: Intervalo de sondeo de la nube
    description: Intervalo de sondeo de la nube en minutos
  event_duration:
    name: Duración del evento
    description: Duración del evento del dispositivo en segundos (tiempo de reinicio del evento)
  snapshot_cache:
    name: Guardar imágenes de eventos
    description: Conserva la última imagen válida de cada cámara después de reiniciar el complemento
  mega_inventory_diagnostics:
    name: Escanear catálogos de eufy Mega
    description: Lee en segundo plano catálogos nativos de dispositivos, funciones, datos y OTA
  firmware_research:
    name: Descargar firmware E10 para investigación
    description: Guarda un paquete OTA E10 ofrecido por el servidor sin iniciar una actualización
  trusted_device_name:
    name: Nombre del dispositivo de confianza
    description: Nombre opcional de este servicio en la lista de dispositivos de confianza de Eufy
  debug:
    name: Depurar
    description: Activar el modo de depuración
  port:
    name: Puerto
    description: Puerto de escucha (host)
  stations:
    name: Estaciones
    description: Direcciones IP o direcciones de difusión sugeridas para las estaciones
  ipv4first:
    name: Forzar direcciones IPv4 primero
    description: Fuerza el orden de los resultados dns en Node.js para devolver primero las direcciones IPv4
