name: Baiamonte eufy Bridge
description: >-
  Baiamonte-branded Schema-21 bridge and dashboard for eufy devices, using Mega
  authentication and discovery with safe compatibility coverage and native P2P control.
version: "1.6.6"
slug: baiamonte_eufy_bridge
url: https://github.com/drahamin/baiamonte-eufy-bridge
init: false
arch:
  - aarch64
  - amd64
stage: experimental
host_network: true
ingress: true
ingress_port: 8097
panel_icon: mdi:cctv
panel_title: Baiamonte eufy
panel_admin: true
map:
  - share:rw
timeout: 60
startup: services
boot: auto
options:
  username: null
  password: null
  country: US
  port: 3000
  polling_interval: 10
  accept_invitations: true
  debug: false
  ipv4first: false
  event_duration: 10
  snapshot_cache: true
  mega_inventory_diagnostics: true
  firmware_research: false
  stations: []
schema:
  username: email
  password: password
  country: list(AD|AE|AF|AG|AI|AL|AM|AO|AQ|AR|AS|AT|AU|AW|AX|AZ|BA|BB|BD|BE|BF|BG|BH|BI|BJ|BL|BM|BN|BO|BQ|BR|BS|BT|BV|BW|BY|BZ|CA|CC|CD|CF|CG|CH|CI|CK|CL|CM|CN|CO|CR|CU|CV|CW|CX|CY|CZ|DE|DJ|DK|DM|DO|DZ|EC|EE|EG|EH|ER|ES|ET|FI|FJ|FK|FM|FO|FR|GA|GB|GD|GE|GF|GG|GH|GI|GL|GM|GN|GP|GQ|GR|GS|GT|GU|GW|GY|HK|HM|HN|HR|HT|HU|ID|IE|IL|IM|IN|IO|IQ|IR|IS|IT|JE|JM|JO|JP|KE|KG|KH|KI|KM|KN|KP|KR|KW|KY|KZ|LA|LB|LC|LI|LK|LR|LS|LT|LU|LV|LY|MA|MC|MD|ME|MF|MG|MH|MK|ML|MM|MN|MO|MP|MQ|MR|MS|MT|MU|MV|MW|MX|MY|MZ|NA|NC|NE|NF|NG|NI|NL|NO|NP|NR|NU|NZ|OM|PA|PE|PF|PG|PH|PK|PL|PM|PN|PR|PS|PT|PW|PY|QA|RE|RO|RS|RU|RW|SA|SB|SC|SD|SE|SG|SH|SI|SJ|SK|SL|SM|SN|SO|SR|SS|ST|SV|SX|SY|SZ|TC|TD|TF|TG|TH|TJ|TK|TL|TM|TN|TO|TR|TT|TV|TW|TZ|UA|UG|UM|US|UY|UZ|VA|VC|VE|VG|VI|VN|VU|WF|WS|YE|YT|ZA|ZM|ZW)
  port: port
  polling_interval: int(1,1440)
  accept_invitations: bool
  debug: bool
  ipv4first: bool
  event_duration: int(1,3600)
  snapshot_cache: bool
  mega_inventory_diagnostics: bool
  firmware_research: bool
  trusted_device_name: str?
  stations:
    - serial_number: str
      ip_address: match(^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$)
